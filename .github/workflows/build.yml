name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy opencv-python-headless pytest
      - run: python -m pytest -q

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller
      - name: Unit tests
        run: python -m pytest -q
      - name: Smoke test (simulated projector, real Qt)
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m cinecapture --smoke-test
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="0.1.0.$GITHUB_RUN_NUMBER"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build app (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --name CineCapturePro
          --paths . --collect-submodules cinecapture --collect-submodules pygrabber
          --hidden-import hid --hidden-import serial.tools.list_ports
          --add-data "LICENSE;."
          packaging/launcher.py
      - name: Smoke test the built app
        shell: pwsh
        timeout-minutes: 3
        env:
          CCP_LOG: ${{ github.workspace }}\smoke-exe.log
        run: |
          Get-ChildItem -Recurse dist\CineCapturePro -Filter "q*.dll" | Where-Object { $_.Directory.Name -eq "platforms" } | ForEach-Object { Write-Host "platform plugin: $($_.Name)" }
          $p = Start-Process -FilePath dist\CineCapturePro\CineCapturePro.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(90000)) { Write-Host "App did not exit within 90 s"; Stop-Process -Id $p.Id -Force; $code = 99 } else { $code = $p.ExitCode }
          Write-Host "Exit code: $code"
          if (Test-Path $env:CCP_LOG) { Get-Content $env:CCP_LOG }
          exit $code
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CineCapturePro-Setup-${{ steps.ver.outputs.version }}
          path: dist/installer/*.exe
      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: CineCapturePro-portable-${{ steps.ver.outputs.version }}
          path: dist/CineCapturePro
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
